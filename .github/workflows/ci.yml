name: 'longvarmeth CI'

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  pytest:
    name: 'Python Unit & Integrity Tests'
    runs-on: ubuntu-latest
    steps:
      - name: Check out pipeline code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies & run pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pytest tests/unit_tests/ -v

  pipeline_stub:
    name: 'Nextflow Pipeline Stub Tests'
    runs-on: ubuntu-latest
    needs: pytest
    strategy:
      matrix:
        profile: ['test_ont', 'test_pacbio']
    steps:
      - name: Check out pipeline code
        uses: actions/checkout@v4

      - name: Set up Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: 'latest'

      - name: Run pipeline dry-run stub test
        run: |
          nextflow run main.nf -profile ${{ matrix.profile }} -stub

