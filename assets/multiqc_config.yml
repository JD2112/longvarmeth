report_header_info:
    - Pipeline: "longvarmeth"
    - Contact: "Jyotirmoy Das"
    - Project: "Long-Read Variant Calling & Methylation Pipeline"

report_comment: >
    This report has been generated by the Nextflow DSL2 longvarmeth pipeline.

report_section_order:
    "pipeline-summary":
        order: -1002
    "software-versions":
        order: -1001
    "methods-description":
        order: -1000

custom_data:
    pipeline-summary:
        file_format: "yaml"
        section_name: "Workflow Summary"
        description: "Parameters used for this pipeline run."
        plot_type: "html"
    software-versions:
        file_format: "yaml"
        section_name: "Software Versions"
        plot_type: "html"
    methods-description:
        file_format: "yaml"
        section_name: "Methods Description"
        plot_type: "html"

export_plots: true

# Aesthetics
title: "Long-Read Analysis Report"
subtitle: "Comprehensive Long-Read QC, Assembly, Variant, and Methylation Profiling"
project_name: "ONT-Long-Read-Pipeline"

# Module ordering
run_modules:
    - fastqc
    - nanoplot
    - quast
    - busco
    - bcftools
    - whatshap
    - custom_content

module_order:
    - fastqc
    - nanoplot
    - quast
    - busco
    - bcftools
    - whatshap
    - custom_content
